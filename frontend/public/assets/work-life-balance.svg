<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="balanceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="balanceShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#balanceBg)"/>

  <!-- Left: Focused Sprint (Work/Study) -->
  <g transform="translate(60, 60)" filter="url(#balanceShadow)">
    <rect width="320" height="380" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="320" height="8" rx="4" fill="#6366F1"/>
    
    <circle cx="48" cy="48" r="20" fill="#EEF2FF"/>
    <text x="38" y="55" font-family="system-ui, sans-serif" font-size="20">⚡</text>
    <text x="80" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Deep Work Flow</text>
    <text x="80" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6366F1">High-Impact Focus Sessions</text>

    <!-- Mini Flow Items -->
    <g transform="translate(24, 88)">
      <rect width="272" height="64" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
      <circle cx="24" cy="32" r="12" fill="#6366F1"/>
      <text x="18" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF">1</text>
      <text x="48" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">90m Focus Sprint</text>
      <text x="48" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Protected uninterrupted work</text>
      <rect x="210" y="20" width="50" height="24" rx="8" fill="#EEF2FF"/>
      <text x="220" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4F46E5">+40%</text>

      <g transform="translate(0, 76)">
        <rect width="272" height="64" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
        <circle cx="24" cy="32" r="12" fill="#0D9488"/>
        <text x="18" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF">2</text>
        <text x="48" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Scikit-Learn Calibrated</text>
        <text x="48" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Accurate duration bounds</text>
        <rect x="210" y="20" width="50" height="24" rx="8" fill="#F0FDFA"/>
        <text x="222" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0D9488">0 Leak</text>
      </g>

      <g transform="translate(0, 152)">
        <rect width="272" height="64" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
        <circle cx="24" cy="32" r="12" fill="#8B5CF6"/>
        <text x="18" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF">3</text>
        <text x="48" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Zero Context Switching</text>
        <text x="48" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Energy curve prioritization</text>
        <rect x="210" y="20" width="50" height="24" rx="8" fill="#FAF5FF"/>
        <text x="218" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7C3AED">Smooth</text>
      </g>
    </g>

    <text x="32" y="348" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10B981">✓ Delivers on priorities without working overtime</text>
  </g>

  <!-- Right: Restorative Living (Rest, Health, Hobbies) -->
  <g transform="translate(420, 60)" filter="url(#balanceShadow)">
    <rect width="320" height="380" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="320" height="8" rx="4" fill="#10B981"/>

    <circle cx="48" cy="48" r="20" fill="#ECFDF5"/>
    <text x="38" y="55" font-family="system-ui, sans-serif" font-size="20">🌿</text>
    <text x="80" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Restorative Balance</text>
    <text x="80" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981">Recharge, Health &amp; Downtime</text>

    <!-- Mini Rest Items -->
    <g transform="translate(24, 88)">
      <rect width="272" height="64" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
      <circle cx="24" cy="32" r="12" fill="#F59E0B"/>
      <text x="17" y="37" font-family="system-ui, sans-serif" font-size="13">☕</text>
      <text x="48" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Mandatory Smart Breaks</text>
      <text x="48" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">30m refresh after 2h continuous</text>
      <rect x="210" y="20" width="50" height="24" rx="8" fill="#FEF3C7"/>
      <text x="218" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#B45309">Restore</text>

      <g transform="translate(0, 76)">
        <rect width="272" height="64" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
        <circle cx="24" cy="32" r="12" fill="#10B981"/>
        <text x="17" y="37" font-family="system-ui, sans-serif" font-size="13">🏃</text>
        <text x="48" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Fitness &amp; Movement</text>
        <text x="48" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Protected workout window</text>
        <rect x="210" y="20" width="50" height="24" rx="8" fill="#ECFDF5"/>
        <text x="224" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">45m</text>
      </g>

      <g transform="translate(0, 152)">
        <rect width="272" height="64" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
        <circle cx="24" cy="32" r="12" fill="#EC4899"/>
        <text x="17" y="37" font-family="system-ui, sans-serif" font-size="13">🌙</text>
        <text x="48" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Evenings for You</text>
        <text x="48" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Strict work boundary cut-off</text>
        <rect x="210" y="20" width="50" height="24" rx="8" fill="#FDF2F8"/>
        <text x="218" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#BE185D">Peace</text>
      </g>
    </g>

    <text x="32" y="348" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#6366F1">★ Burnout prevented by realistic scheduling limits</text>
  </g>
</svg>
