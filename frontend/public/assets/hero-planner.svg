<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="32" fill="url(#heroBg)"/>

  <!-- Subtle Grid Lines -->
  <path d="M50 150 H750 M50 300 H750 M50 450 H750" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 6"/>
  <path d="M200 50 V550 M400 50 V550 M600 50 V550" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Glowing Aura -->
  <circle cx="400" cy="280" r="180" fill="#818CF8" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Center Floating Tablet Workspace -->
  <rect x="180" y="90" width="440" height="340" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Tablet Top Bar -->
  <rect x="180" y="90" width="440" height="48" rx="24" fill="#F8FAFC"/>
  <rect x="180" y="114" width="440" height="24" fill="#F8FAFC"/>
  <circle cx="212" cy="114" r="6" fill="#EF4444" fill-opacity="0.7"/>
  <circle cx="230" cy="114" r="6" fill="#F59E0B" fill-opacity="0.7"/>
  <circle cx="248" cy="114" r="6" fill="#10B981" fill-opacity="0.7"/>
  <rect x="310" y="104" width="180" height="20" rx="8" fill="#EEF2FF"/>
  <text x="340" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#6366F1">timeweave.app/planner</text>

  <!-- Planner Schedule Blocks Inside Workspace -->
  <g transform="translate(204, 154)">
    <!-- Schedule Header -->
    <rect x="0" y="0" width="392" height="32" rx="8" fill="#F8FAFC"/>
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Today's Adaptive Timeline</text>
    <rect x="290" y="6" width="90" height="20" rx="10" fill="#ECFDF5"/>
    <text x="302" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">● 100% Feasible</text>

    <!-- Block 1: Deep Focus -->
    <rect x="0" y="44" width="392" height="52" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="12" y="56" width="28" height="28" rx="8" fill="#6366F1"/>
    <path d="M22 70 L25 73 L31 66" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">Machine Learning Lecture</text>
    <text x="50" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#6366F1">09:00 AM – 10:15 AM • High Energy</text>
    <rect x="316" y="58" width="64" height="24" rx="8" fill="#FFFFFF"/>
    <text x="328" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4338CA">1h 15m</text>

    <!-- Block 2: Cognitive Recovery Break -->
    <rect x="0" y="104" width="392" height="42" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="26" cy="125" r="12" fill="#F59E0B"/>
    <text x="21" y="129" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">☕</text>
    <text x="50" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400E">Restorative Break &amp; Hydration</text>
    <text x="50" y="139" font-family="system-ui, sans-serif" font-size="10" fill="#B45309">10:15 AM – 10:35 AM • Mental Reset</text>
    <rect x="330" y="113" width="50" height="22" rx="8" fill="#FFFFFF"/>
    <text x="342" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#B45309">20m</text>

    <!-- Block 3: API Sprint -->
    <rect x="0" y="154" width="392" height="52" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <rect x="12" y="166" width="28" height="28" rx="8" fill="#0D9488"/>
    <circle cx="26" cy="180" r="5" fill="#FFFFFF"/>
    <text x="50" y="178" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#134E4A">API Gateway Architecture</text>
    <text x="50" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#0D9488">10:35 AM – 12:15 PM • ML Estimated</text>
    <rect x="316" y="168" width="64" height="24" rx="8" fill="#FFFFFF"/>
    <text x="328" y="184" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F766E">1h 40m</text>

    <!-- Block 4: Lunch & Rest -->
    <rect x="0" y="214" width="392" height="42" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="50" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">Lunch &amp; Walk Outside</text>
    <text x="50" y="249" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">12:15 PM – 01:00 PM • Healthy Recharge</text>
    <rect x="330" y="223" width="50" height="22" rx="8" fill="#FFFFFF"/>
    <text x="342" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748B">45m</text>
  </g>

  <!-- Floating Left Card: AI Prediction Calibrator -->
  <g transform="translate(60, 240)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="14" width="36" height="36" rx="10" fill="#6366F1" fill-opacity="0.12"/>
    <path d="M32 24 L34 29 L39 31 L34 33 L32 38 L30 33 L25 31 L30 29 Z" fill="#6366F1"/>
    <text x="58" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A">ML Duration</text>
    <text x="58" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Random Forest</text>
    <line x1="14" y1="62" x2="166" y2="62" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="14" y="84" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#4F46E5">1h 15m</text>
    <text x="14" y="104" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#10B981">↓ 15m faster than est.</text>
    <rect x="14" y="116" width="152" height="18" rx="6" fill="#F8FAFC"/>
    <text x="22" y="129" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6366F1">94% Confidence Bound</text>
  </g>

  <!-- Floating Right Card: Overload Protection -->
  <g transform="translate(560, 280)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="160" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="18" fill="#10B981" fill-opacity="0.12"/>
    <path d="M26 32 L30 36 L38 28" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A">Workload Status</text>
    <text x="58" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10B981">Balanced (68%)</text>
    <line x1="14" y1="62" x2="166" y2="62" stroke="#F1F5F9" stroke-width="1.5"/>
    
    <!-- Progress Bar -->
    <rect x="14" y="74" width="152" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="14" y="74" width="103" height="10" rx="5" fill="url(#primaryGrad)"/>
    <text x="14" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E293B">4h 15m Planned</text>
    <text x="14" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">2h 00m Free Capacity</text>
    <rect x="14" y="128" width="152" height="20" rx="6" fill="#F0FDF4"/>
    <text x="24" y="142" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803D">✓ Zero Overcommitment</text>
  </g>

  <!-- Floating Floating Habit Pill Top -->
  <g transform="translate(240, 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="320" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="10" fill="#6366F1"/>
    <text x="18" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF">✨</text>
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">Adaptive Engine • Calibrated to Shivani's rhythm</text>
  </g>
</svg>
