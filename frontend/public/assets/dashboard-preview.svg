<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%" fill="none">
  <defs>
    <filter id="dashShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- App Window Frame -->
  <g filter="url(#dashShadow)">
    <rect width="900" height="540" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

    <!-- App Window Header Bar -->
    <rect width="900" height="40" rx="20" fill="#FFFFFF"/>
    <rect y="20" width="900" height="20" fill="#FFFFFF"/>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="28" cy="20" r="5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="44" cy="20" r="5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="60" cy="20" r="5" fill="#10B981" fill-opacity="0.8"/>
    <rect x="360" y="10" width="180" height="20" rx="6" fill="#F1F5F9"/>
    <text x="390" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748B">TimeWeave Dashboard</text>

    <!-- Sidebar representation -->
    <rect x="0" y="40" width="180" height="500" fill="#0F172A"/>
    <g transform="translate(16, 56)">
      <circle cx="14" cy="14" r="10" fill="#6366F1"/>
      <text x="32" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">TimeWeave</text>

      <g transform="translate(0, 40)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
        <rect x="0" y="0" width="148" height="32" rx="8" fill="#6366F1"/>
        <text x="36" y="20" fill="#FFFFFF">Dashboard</text>
        <text x="36" y="56" fill="#94A3B8">Tasks</text>
        <text x="36" y="92" fill="#94A3B8">Calendar</text>
        <text x="36" y="128" fill="#94A3B8">AI Planner</text>
        <text x="36" y="164" fill="#94A3B8">Analytics</text>
        <text x="36" y="200" fill="#94A3B8">Focus Mode</text>
        <text x="36" y="236" fill="#94A3B8">Settings</text>
      </g>
    </g>

    <!-- Main Dashboard Area -->
    <g transform="translate(200, 56)">
      <!-- Welcome Header -->
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Good Morning, Shivani! ☀️</text>
      <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Adaptive Schedule • All tasks within healthy 72% capacity</text>

      <!-- 4 KPI Cards -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="158" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="14" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">5</text>
        <text x="14" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Tasks Today</text>

        <rect x="174" y="0" width="158" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="188" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#10B981">2</text>
        <text x="188" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Completed</text>

        <rect x="348" y="0" width="158" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="362" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F59E0B">2h 15m</text>
        <text x="362" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Focus Time</text>

        <rect x="522" y="0" width="158" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="536" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#6366F1">85%</text>
        <text x="536" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Productivity</text>
      </g>

      <!-- Today's Schedule Card -->
      <g transform="translate(0, 132)">
        <rect x="0" y="0" width="370" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Today's Schedule</text>
        <text x="300" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6366F1">View All →</text>

        <!-- Block 1 -->
        <rect x="16" y="36" width="338" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="32" cy="56" r="8" fill="#10B981"/>
        <path d="M29 56 L31 58 L35 54" stroke="#FFF" stroke-width="1.5"/>
        <text x="48" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Machine Learning Lecture</text>
        <text x="48" y="66" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">09:00 AM • 1h 15m</text>

        <!-- Block 2 -->
        <rect x="16" y="82" width="338" height="40" rx="8" fill="#FEF3C7" stroke="#FDE68A"/>
        <text x="48" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">☕ Smart Recovery Break</text>
        <text x="48" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#B45309">10:15 AM • 20m</text>

        <!-- Block 3 -->
        <rect x="16" y="128" width="338" height="40" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
        <circle cx="32" cy="148" r="8" fill="#0D9488"/>
        <text x="48" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#134E4A">API Gateway Implementation</text>
        <text x="48" y="158" font-family="system-ui, sans-serif" font-size="9" fill="#0D9488">10:35 AM • 1h 40m</text>

        <!-- Block 4 -->
        <rect x="16" y="174" width="338" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="32" cy="194" r="8" fill="#E2E8F0"/>
        <text x="48" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Cardio and Mobility</text>
        <text x="48" y="204" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">05:30 PM • 45m</text>
      </g>

      <!-- Weekly Overview Bar Chart Mockup -->
      <g transform="translate(390, 132)">
        <rect x="0" y="0" width="290" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Weekly Planned vs Actual (Hours)</text>

        <!-- Chart Grid Lines -->
        <line x1="16" y1="60" x2="274" y2="60" stroke="#F1F5F9"/>
        <line x1="16" y1="110" x2="274" y2="110" stroke="#F1F5F9"/>
        <line x1="16" y1="160" x2="274" y2="160" stroke="#F1F5F9"/>
        <line x1="16" y1="190" x2="274" y2="190" stroke="#E2E8F0"/>

        <!-- Bars: Mon - Fri -->
        <!-- Mon -->
        <rect x="36" y="100" width="12" height="90" rx="3" fill="#6366F1"/>
        <rect x="50" y="120" width="12" height="70" rx="3" fill="#06B6D4"/>
        <text x="44" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Mon</text>

        <!-- Tue -->
        <rect x="84" y="80" width="12" height="110" rx="3" fill="#6366F1"/>
        <rect x="98" y="90" width="12" height="100" rx="3" fill="#06B6D4"/>
        <text x="92" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Tue</text>

        <!-- Wed -->
        <rect x="132" y="70" width="12" height="120" rx="3" fill="#6366F1"/>
        <rect x="146" y="85" width="12" height="105" rx="3" fill="#06B6D4"/>
        <text x="140" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#6366F1">Wed</text>

        <!-- Thu -->
        <rect x="180" y="95" width="12" height="95" rx="3" fill="#6366F1"/>
        <rect x="194" y="105" width="12" height="85" rx="3" fill="#06B6D4"/>
        <text x="188" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Thu</text>

        <!-- Fri -->
        <rect x="228" y="110" width="12" height="80" rx="3" fill="#6366F1"/>
        <rect x="242" y="130" width="12" height="60" rx="3" fill="#06B6D4"/>
        <text x="236" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Fri</text>
      </g>

      <!-- AI Insight Banner Bottom -->
      <g transform="translate(0, 376)">
        <rect x="0" y="0" width="680" height="48" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
        <circle cx="24" cy="24" r="12" fill="#6366F1"/>
        <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF">✨</text>
        <text x="46" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1E1B4B">Cognitive Workload Recommendation</text>
        <text x="46" y="37" font-family="system-ui, sans-serif" font-size="10" fill="#4338CA">Schedule optimized with 20m restorative break between demanding focus blocks.</text>
      </g>
    </g>
  </g>
</svg>
